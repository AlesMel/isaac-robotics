# Default sweep: full benchmark matrix.
#   franka_lift: 5 kernels x 5 seeds = 25 cells (~3h each at 500k timesteps)
#   ur3e_lift:   4 kernels x 5 seeds = 20 cells (~3-6h each at 300k timesteps)
# Total: 45 cells, ~7-9 days single-GPU wall clock on RTX 4070 Ti.
# For phased execution use sweep_franka.yaml / sweep_ur3e.yaml instead.

tasks:
  - franka_lift
  - ur3e_lift

# Fallback kernel list (used for tasks not present in kernels_per_task).
kernels:
  - tanh
  - gaussian
  - velocity_gated_tanh
  - tanh_additive_velpen

# The smooth-gate ablation runs on franka only (compute budget); the additive
# velocity-penalty baseline runs on both robots.
kernels_per_task:
  franka_lift:
    - tanh
    - gaussian
    - velocity_gated_tanh
    - tanh_additive_velpen
    - velocity_gated_tanh_smooth
  ur3e_lift:
    - tanh
    - gaussian
    - velocity_gated_tanh
    - tanh_additive_velpen

seeds: [0, 1, 2, 3, 4]

# Uses each task's default num_envs (Franka 4096, UR3e 8192).
num_envs: null

# Training budget in skrl TRAINER TIMESTEPS (passed via
# ++agent.trainer.timesteps; never train.py's --max_iterations, which
# silently multiplies by rollouts). null -> per-task defaults:
#   franka 500_000 (peak observed ~240-360k + drift-observation margin),
#   ur3e   300_000 (tuned skrl YAML default).
max_timesteps: null

# TB scalar write interval in trainer timesteps. skrl's "auto" (= timesteps/100)
# is too sparse for the smoothed drift metric; 500 -> 1000 points (franka) /
# 600 points (ur3e).
tb_write_interval: 500

# Phases
eval_only: false
skip_eval: false
eval_num_envs: 64
eval_num_episodes: 100

# Per-cell wall-clock ceilings.
# ur3e seeds that *learn* run ~6x slower than stuck seeds (complex contact
# physics during actual grasping); a learning 300k-step ur3e run takes ~6h.
# franka at 500k timesteps takes ~3h. 8h covers both with margin; a hung cell
# is killed and labeled (timeout / kit_crash_dialog) instead of stalling the
# sweep.
train_timeout_s: 28800   # 8 h
eval_timeout_s: 1800     # 30 min

# Set to true to force retraining even when best_agent.pt already exists.
force: false

# --- Training video recording ---
# ON: one clip every 10% of each task's training budget (video_interval:
# null -> auto = max_timesteps // 10, i.e. 50k for franka / 30k for ur3e,
# ~11 clips per run). Rendering adds 10-20% overhead; a kit crash-dialog
# hang was once observed during a video run, but the log watchdog in
# _run_subprocess now kills such hangs within ~30s and labels the cell
# fail(kit_crash_dialog) instead of burning the 8h timeout.
record_video_train: true
video_length: 300       # frames per clip (~12s at 25fps render)
video_interval: null    # auto: max_timesteps // 10
