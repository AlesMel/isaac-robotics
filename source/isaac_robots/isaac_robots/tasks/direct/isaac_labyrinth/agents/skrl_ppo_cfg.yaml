seed: 42

# ── Models ────────────────────────────────────────────────────────────────────
# NOTE: When using CNN training (scripts/labyrinth/train_curriculum.py), the
#   actual model architecture (NatureCnnPolicy + MlpCritic) is defined in
#   agents/cnn_mlp_model.py and instantiated directly by the training script,
#   bypassing the YAML model definitions below. The model section here is only
#   used by the generic scripts/skrl/train.py runner (flat MLP mode).
# Asymmetric actor-critic: actor sees stacked images + proprio,
# critic sees privileged state (goal, vel, geodesic, obstacle dist).
models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256, 128]
        activations: tanh
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [256, 256]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

# ── Agent ─────────────────────────────────────────────────────────────────────
agent:
  class: PPO
  rollouts: 48
  learning_epochs: 8
  mini_batches: 8
  discount_factor: 0.995
  lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.01
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.1
  time_limit_bootstrap: True
  experiment:
    directory: "labyrinth_direct"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 1_000_000
  environment_info: log
